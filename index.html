<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة قسم الكمبيوتر - معاهد الغد المشرق الأزهري للغات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <header class="text-center mb-8">
        <img src="logo.jpeg" alt="شعار المعهد" class="w-32 h-32 mx-auto rounded-lg mb-4 object-contain bg-white">
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2" id="main-title">معهد الغد المشرق الأزهري للغات</h1>
        <h2 class="text-lg text-orange-400" id="sub-title">مسابقة قسم الكمبيوتر والذكاء الاصطناعي - الإعدادي والثانوي</h2>
    </header>

    <!-- 1. شاشة اختيار اللغة -->
    <main id="language-screen" class="glass-panel p-6 sm:p-8 rounded-2xl w-full max-w-md text-center relative">
        <button id="admin-btn" class="absolute top-4 left-4 text-sm text-gray-400 hover:text-white flex items-center gap-1">
            <span>⚙️ الإدارة</span>
        </button>
        <h3 class="text-2xl font-bold text-white mb-8 mt-4">اختر قسمك / Choose Your Section</h3>
        <div class="space-y-4">
            <button onclick="selectLanguage('ar')" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 px-4 rounded-lg text-xl transition-colors">
                القسم العربي (Arabic)
            </button>
            <button onclick="selectLanguage('en')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-lg text-xl transition-colors" dir="ltr">
                قسم اللغات (Languages)
            </button>
        </div>
    </main>

    <!-- 2. شاشة التسجيل -->
    <section id="login-screen" class="hidden-section glass-panel p-6 sm:p-8 rounded-2xl w-full max-w-md">
        <button onclick="goBackToLanguage()" class="text-gray-400 hover:text-white mb-4 text-sm" id="back-btn">➔ رجوع</button>
        <h3 class="text-2xl font-bold text-center text-orange-500 mb-6" id="login-title">تسجيل الطالب</h3>
        
        <form id="registration-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-300" id="lbl-name">الاسم الرباعي</label>
                <input type="text" id="student-name" required class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none text-white">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300" id="lbl-grade">الصف الدراسي</label>
                <input type="text" id="student-grade" required class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none text-white">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300" id="lbl-email">البريد الإلكتروني المدرسي</label>
                <input type="email" id="student-email" required class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none text-white text-left" dir="ltr">
                <p class="text-xs text-gray-400 mt-2" id="lbl-note">⚠️ يجب أن ينتهي بـ @alghadalmoshreq.edu.eg. (محاولة واحدة فقط)</p>
            </div>
            <button type="submit" id="start-btn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-lg mt-4">
                ابدأ المسابقة ▶
            </button>
        </form>
    </section>

    <!-- 3. شاشة المسابقة -->
    <section id="quiz-screen" class="hidden-section glass-panel p-6 sm:p-8 rounded-2xl w-full max-w-2xl relative">
        <div class="flex justify-between items-center mb-6 border-b border-slate-600 pb-4">
            <span class="text-orange-400 font-bold" id="question-
